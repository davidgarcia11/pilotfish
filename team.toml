# Which model plays each role in the team.
#
# This file ships the recommended defaults and is updated with the repository.
# Your own settings live in ~/.config/pilotfish/team.toml (create it with `pilotfish config`)
# and take precedence: put there only what you want to change.
#
# Each model is written "agent:model". The agent is the command Orca launches: claude, codex, opencode, cursor…
# With OpenCode, the model is prefixed by its provider: "opencode:deepseek/deepseek-flash".
# Pilotfish skips OpenCode models that `opencode models <provider>` does not list.

# Each tier is a list in order of preference: the first available model is used.
# A model is unavailable when its agent is not installed, has no active login,
# or has run out of usage (the coordinator excludes it and moves to the next one).
[tiers]
strong = ["claude:opus", "codex:gpt-6-astra", "opencode:deepseek/deepseek-v4-pro", "opencode:zai-coding-plan/glm-5.3"]
standard = ["claude:sonnet", "codex:gpt-6-sol", "opencode:deepseek/deepseek-v4-pro", "opencode:zai-coding-plan/glm-5.3"]
budget = ["opencode:deepseek/deepseek-flash", "opencode:zai-coding-plan/glm-5.3-flash", "claude:sonnet"]

# Each role asks for a tier, or for its own list if you want something very specific:
#   security = ["claude:opus", "codex:gpt-6-astra"]
[roles]
plan = "strong"           # coordinator: specification and plan
coordinate = "standard"   # coordinator: dispatch, verify, document and open the PR
developer = "budget"
qa = "budget"
reviewer = "standard"
bug_hunter = "strong"
security = "strong"

# Reasoning effort of each worker Orca launches (low, medium, high). Roles not listed use "default".
# It matters for Claude workers; other agents may ignore it. More effort means more usage.
# The coordinator's own effort is the one of the tab you open in Orca.
[effort]
default = "medium"
# qa = "low"

[rules]
# How many auditors work on each flow:
#   "ask"       the coordinator asks at the start of every flow (default),
#   "full"      QA, reviewer, bug hunter and security, always,
#   "necessary" QA and reviewer; bug hunter and security when the change calls for them,
#   "minimal"   no auditors: the coordinator reviews the diff itself.
team_mode = "ask"
# When no model is left in a role's tier:
#   "pause"     stop and tell the user (recommended for sensitive roles),
#   "downgrade" use the next tier down (strong → standard → budget).
when_tier_exhausted = "pause"
# The reviewer picks, when possible, a model from a different provider than the developer's.
reviewer_different_provider = true
