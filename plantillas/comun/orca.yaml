# Qué hace Orca al crear y al archivar un worktree de este proyecto.
# Los archivos locales que no van en git (.env, AGENTS.md, CLAUDE.md, .claude/) los copia Orca según .worktreeinclude.
scripts:
  setup: |
    cd "$ORCA_WORKTREE_PATH"
    mise trust && mise install && mise run setup
  archive: |
    cd "$ORCA_WORKTREE_PATH"
    if [ "$(git rev-parse --git-dir)" != "$(git rev-parse --git-common-dir)" ] && [ -x scripts/entorno-worktree.sh ]; then
      scripts/entorno-worktree.sh --borrar
    fi
